[project]
name = "psai-backend"
version = "0.1.0"
description = "P.S.AI — Posthumous Social Artificial Intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "rdflib>=7.1.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "cryptography>=43.0.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
security = [
    "argon2-cffi>=23.1.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
